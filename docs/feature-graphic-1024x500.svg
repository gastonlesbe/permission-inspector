<svg width="1024" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#011f3a"/>
      <stop offset="100%" style="stop-color:#023c69"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ecfbe;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#0ecfbe;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#0ecfbe" opacity="0.08"/>
  </pattern>
  <rect width="1024" height="500" fill="url(#dots)"/>

  <!-- Left side: branding -->

  <!-- Small label -->
  <text x="72" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="13" font-weight="600" fill="#0ecfbe" letter-spacing="3">BY GRISCAL</text>

  <!-- App name -->
  <text x="68" y="222" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Permission</text>
  <text x="68" y="284" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="52" font-weight="800" fill="#0ecfbe" letter-spacing="-1">Inspector</text>

  <!-- Tagline -->
  <text x="70" y="332" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="18" fill="#8a8fa8">Know what your apps can really do.</text>

  <!-- Shield icon small -->
  <g transform="translate(68, 358)">
    <path d="M18 4 L30 8 L30 18 Q30 26 18 30 Q6 26 6 18 L6 8 Z"
          fill="none" stroke="#0ecfbe" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="17" cy="17" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="21" y1="21" x2="25" y2="25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="108" y="380" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="13" fill="#8a8fa8">Privacy transparency for Android</text>

  <!-- Divider line -->
  <line x1="480" y1="60" x2="480" y2="440" stroke="#0ecfbe" stroke-width="1" opacity="0.15"/>

  <!-- Right side: 3 feature cards -->

  <!-- CARD 1 — Microphone -->
  <rect x="516" y="60" width="148" height="372" rx="20" fill="url(#cardGrad)" stroke="#0ecfbe" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Mic icon -->
  <rect x="574" y="106" width="32" height="52" rx="16" fill="none" stroke="#0ecfbe" stroke-width="3"/>
  <path d="M558 160 Q558 188 590 188 Q622 188 622 160" fill="none" stroke="#0ecfbe" stroke-width="3" stroke-linecap="round"/>
  <line x1="590" y1="188" x2="590" y2="204" stroke="#0ecfbe" stroke-width="3" stroke-linecap="round"/>
  <line x1="574" y1="204" x2="606" y2="204" stroke="#0ecfbe" stroke-width="3" stroke-linecap="round"/>
  <text x="590" y="248" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Microphone</text>
  <text x="590" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="11" fill="#8a8fa8" text-anchor="middle">See which apps</text>
  <text x="590" y="286" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="11" fill="#8a8fa8" text-anchor="middle">can listen</text>
  <!-- Arrow button -->
  <rect x="548" y="368" width="84" height="32" rx="16" fill="#0ecfbe" opacity="0.15"/>
  <text x="590" y="389" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="12" fill="#0ecfbe" text-anchor="middle">All apps →</text>

  <!-- CARD 2 — Camera -->
  <rect x="682" y="60" width="148" height="372" rx="20" fill="url(#cardGrad)" stroke="#0ecfbe" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Camera icon -->
  <rect x="548" y="100" width="80" height="60" rx="10" fill="none" stroke="#0ecfbe" stroke-width="3"
        transform="translate(208,0)"/>
  <path d="M836 94 L848 80 L860 94" fill="none" stroke="#0ecfbe" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="756" cy="130" r="18" fill="none" stroke="#0ecfbe" stroke-width="3"/>
  <circle cx="756" cy="130" r="6" fill="#0ecfbe"/>
  <text x="756" y="248" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Camera</text>
  <text x="756" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="11" fill="#8a8fa8" text-anchor="middle">See which apps</text>
  <text x="756" y="286" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="11" fill="#8a8fa8" text-anchor="middle">can record</text>
  <rect x="714" y="368" width="84" height="32" rx="16" fill="#0ecfbe" opacity="0.15"/>
  <text x="756" y="389" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="12" fill="#0ecfbe" text-anchor="middle">All apps →</text>

  <!-- CARD 3 — Location -->
  <rect x="848" y="60" width="148" height="372" rx="20" fill="url(#cardGrad)" stroke="#0ecfbe" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Pin icon -->
  <circle cx="922" cy="128" r="22" fill="none" stroke="#0ecfbe" stroke-width="3"/>
  <circle cx="922" cy="128" r="8" fill="#0ecfbe"/>
  <path d="M922 150 L922 176" stroke="#0ecfbe" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="922" cy="180" rx="14" ry="5" fill="#0ecfbe" opacity="0.35"/>
  <text x="922" y="248" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Location</text>
  <text x="922" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="11" fill="#8a8fa8" text-anchor="middle">See which apps</text>
  <text x="922" y="286" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="11" fill="#8a8fa8" text-anchor="middle">track you</text>
  <rect x="880" y="368" width="84" height="32" rx="16" fill="#0ecfbe" opacity="0.15"/>
  <text x="922" y="389" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="12" fill="#0ecfbe" text-anchor="middle">All apps →</text>

</svg>
